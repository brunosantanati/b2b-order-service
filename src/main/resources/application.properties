# ============================================
# CONFIGURACOES DA APLICACAO
# ============================================
spring.application.name=b2b-order-service
server.port=8080
spring.threads.virtual.enabled=true

# ============================================
# CONEXAO COM O MONGODB
# ============================================
spring.data.mongodb.uri=mongodb://admin:secret@localhost:27017/orders_db?replicaSet=rs0&authSource=admin

# ============================================
# CONFIGURACOES DO SWAGGER / OPENAPI
# ============================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ============================================
# LOGGING
# ============================================
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.br.com.vpsconsulting.b2b_order_service=DEBUG

# ============================================
# KAFKA
# ============================================
spring.kafka.bootstrap-servers=localhost:9092

# Producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer
spring.kafka.consumer.group-id=b2b-order-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*