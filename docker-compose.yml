services:
  # Serviço 1: Banco de Dados MongoDB com Replica Set
  mongodb:
    image: mongo:8.0
    container_name: b2b_mongodb_dev
    restart: always
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=secret
      - MONGO_INITDB_DATABASE=orders_db
    # Inicia o servidor em modo Replica Set com autenticação e suporte a chaves de transação
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/data/configdb/keyfile"]
    entrypoint:
      - bash
      - -c
      - |
        # Cria um arquivo de chave para a autenticação interna entre nós do Replica Set
        if [ ! -f /data/configdb/keyfile ]; then
          openssl rand -base64 756 > /data/configdb/keyfile
          chmod 400 /data/configdb/keyfile
          chown 999:999 /data/configdb/keyfile
        fi
        exec docker-entrypoint.sh "$$@"
    healthcheck:
      test: >
        mongosh -u admin -p secret --authenticationDatabase admin --eval "try { rs.status().ok } catch(e) { 0 }" | grep -q "1"
        || mongosh -u admin -p secret --authenticationDatabase admin --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'localhost:27017'}]})"
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - mongo_data_dev:/data/db
    networks:
      - b2b_dev_network

  # Serviço 2: Interface Gráfica Web (Mongo Express)
  mongo-express:
    image: mongo-express:latest
    container_name: b2b_mongo_express_dev
    restart: always
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=secret
      - ME_CONFIG_MONGODB_URL=mongodb://admin:secret@mongodb:27017/?replicaSet=rs0&authSource=admin
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - b2b_dev_network

  # Serviço 3: Apache Kafka (Modo KRaft - Sem Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: b2b_kafka_dev
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data_dev:/var/lib/kafka/data
    networks:
      - b2b_dev_network

  # Serviço 4: Interface Gráfica para o Kafka (Kafka UI)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: b2b_kafka_ui_dev
    restart: always
    ports:
      - "8085:8085"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-b2b-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - b2b_dev_network

volumes:
  mongo_data_dev:
  kafka_data_dev:

networks:
  b2b_dev_network:
    driver: bridge